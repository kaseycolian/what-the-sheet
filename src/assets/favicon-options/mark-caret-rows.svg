<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="">
  <!-- "Caret Rows" - rows narrowing into an open dropdown.

       The filter stack with its last bar replaced by a caret, so the mark states both
       halves of the app: rows narrowing, and the dropdown they narrow through. The
       caret is stroked at 3.5 units - about 2.8px rendered - to hold its weight
       against the two solid bars above it.

       Fallbacks are the default theme (Rink Classic), for standalone/favicon use
       where page CSS never reaches the file. Shapes never touch a DIFFERENT
       accent: accent-vs-accent contrast reaches 1.0:1 in some themes, so form is
       carried by background gaps or by one token where two shapes meet. -->
  <rect x="4" y="6" width="24" height="5" rx="2.5" fill="var(--accent-blue, #3ceaff)"/>
  <rect x="8.25" y="13.5" width="15.5" height="5" rx="2.5" fill="var(--accent-purple, #b57fff)"/>
  <path d="M 11.5 21.5 L 16 26 L 20.5 21.5" fill="none"
        stroke="var(--accent-pink, #ff2ec4)" stroke-width="3.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
